name: Bench

# benches/record.rs in a Linux container on an x86-64 runner: on a push to a bench/**
# branch, or by hand once this workflow is on main.
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Bench (linux/x86-64 container)
    runs-on: ubuntu-latest
    container: rust:1
    steps:
      - uses: actions/checkout@v7
      # quanta reads the TSC only when the CPU reports a constant or nonstop one;
      # otherwise the latency timer falls back to the OS clock.
      - name: CPU and clock source
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -o -w -E 'constant_tsc|nonstop_tsc' /proc/cpuinfo | sort -u
          cat /sys/devices/system/clocksource/clocksource0/current_clocksource
      - run: cargo bench -p nanometer --bench record
