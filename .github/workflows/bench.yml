name: Bench

# benches/record.rs in a Linux container on x86-64 and arm64 runners, and natively on
# Windows x64 and macOS arm64: on a push to a bench/** branch, or by hand once this
# workflow is on main.
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Bench (${{ matrix.runner }}, rust:1 container)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: rust:1
    steps:
      - uses: actions/checkout@v7
      # On x86-64, quanta reads the TSC only when the CPU reports both an invariant
      # (nonstop) TSC and rdtscp; otherwise the latency timer falls back to the OS
      # clock. On arm64 it always reads the system counter.
      - name: CPU and clock source
        run: |
          lscpu | grep -E '^(Architecture|Vendor ID|Model name)'
          grep -o -w -E 'constant_tsc|nonstop_tsc|rdtscp' /proc/cpuinfo | sort -u
          cat /sys/devices/system/clocksource/clocksource0/current_clocksource
      - run: cargo bench -p nanometer --bench record

  native:
    name: Bench (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The bench prints the CPU model on macOS and Linux only.
      - name: CPU
        if: runner.os == 'Windows'
        run: Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors
      - run: cargo bench -p nanometer --bench record
